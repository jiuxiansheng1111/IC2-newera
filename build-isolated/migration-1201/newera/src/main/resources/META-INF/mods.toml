[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="IC2：新纪元开发组"
description='''基于 IC2 Refactored、Create、ProjectE 和 JEI 协作开发的工业附属模组（1.20.1独立迁移版）。
提供受控矿物流程、合金与电子中间体、工业服务器、光纤/WiFi 数据网络、工业手机、EU电动机、科技树和游戏内AI助手。
复用已有加工设备、传动与能源系统，通过统一流程图规划生产，由房主/服主管理多人配置权限。'''

